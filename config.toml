[yellowstone_grpc]
# منبع state استخرها — مستقیم از Yellowstone gRPC (DirectGrpcFast).
# PublicNode سریع‌ترین حالت بدون relay است.
endpoint = "https://solana-yellowstone-grpc.publicnode.com:443"
