[validation]
# ════════════════════════════════════════════════════════════════
# VALIDATION MODE — enabled = true
#   • loop اصلی ربات (Metis/Jito) کاملاً خاموش می‌شود
#   • arb_cycle مسیرهای سودده را محلی پیدا می‌کند
#   • اگر execute_cycles = true: هر hit سودده به Metis فرستاده شده
#     و اگر Metis هم تأیید کرد → swap-instructions → Jito bundle
# برای بازگشت به حالت عادی ربات: enabled = false
# ════════════════════════════════════════════════════════════════
enabled = true
# هر چند ثانیه یک چرخه scan اجرا شود
interval_secs = 5
# حداکثر تعداد pool لاین که در هر چرخه validator نشان داده می‌شود.
# 0 = فقط max/min diff نمایش داده می‌شود (بدون لیست جداگانه استخرها)
max_pools_log = 0
# وقتی true است: cycleهای net-positive به Metis برای ساخت اینستراکشن
# فرستاده شده و سپس به Jito ارسال می‌شوند.
execute_cycles = false
# حداقل سود محلی (و تأیید Metis) به لمپرت قبل از رفتن به /swap-instructions.
# 6600 = tx_fee(5000) + jito_tip(1000) + margin(600)
min_exec_profit_lamports = 6600

[arb_test]
# Mode 1: per-hop strict Metis quote + ammKey match — no Jito sends.
validate_local = false
# Mode 2: send bundle only when Metis output is close to floor (disabled).
positive_slippage_probe = false
# Mode 3: native DEX instructions without Metis — ACTIVE.
send_no_metis = true
# Max CycleHit candidates forwarded per scan cycle.
max_candidates_per_scan = 5
# (unused in send_no_metis mode — kept for validate_local)
enable_3hop_validation = false
strict_dex_filter = true
require_ammkey_match = true

[arb_test.no_metis]
# dry_run=true: شبیه‌سازی انجام می‌شود ولی هیچ تراکنشی به Jito ارسال نمی‌شود.
# هر CycleHit (۲-هاپ و ۳-هاپ) شبیه‌سازی می‌شود و نتیجه در /root/c/dif ذخیره می‌شود.
dry_run = true
# Jito tip per bundle (lamports). Large enough to incentivize landing.
tip_lamports = 100000
# Safety cap: only send cycles where amount_in <= this value (1 million lamports = 0.001 SOL).
max_amount_lamports = 1000000
# Compute unit limit for native transactions.
cu_limit = 300000
# test_land_even_if_loss=true: min_out for the last hop = final_min_out_lamports (allow loss).
# This is to verify the transaction executes at all, not to make profit.
test_land_even_if_loss = true
# Minimum output required from the final hop when test_land_even_if_loss=true.
# 1 = accept any output (pure execution test).
final_min_out_lamports = 1
# LiteSVM vs RAM delta threshold. Transactions where |litesvm_profit - ram_profit| <= threshold
# are considered a match and sent to Jito.
match_threshold_lamports = 500
# Number of parallel LiteSVM simulation workers.
sim_workers = 2
