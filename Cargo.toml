[package]
name = "mev_bot_unified"
version = "3.0.0"
edition = "2021"

[dependencies]
# Core
solana-stream-sdk = "0.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
dotenvy = "0.15"

# Solana SDK
solana-entry = "2.2.1"
solana-sdk = "2.2.2"
solana-transaction-status = "2.2.1"
solana-client = "2.2.2"

# Serialization
bincode = "1.3.3"
borsh = "1.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jsonc = "1"
bs58 = "0.5.1"
base64 = "0.22"
hex = "0.4.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Performance
rayon = "1.10.0"
crossbeam-channel = "0.5.13"
dashmap = "6.0"
lazy_static = "1.5"

# Utils
sha2 = "0.10.8"
anyhow = "1.0"
backoff = { version = "0.4.0", features = ["tokio"] }
tonic = "0.12.1"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
