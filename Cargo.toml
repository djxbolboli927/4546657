[package]
name = "mev_bot_unified"
version = "3.0.0"
edition = "2021"

[dependencies]
# Core - Upgraded to Yellowstone v10/v11 + Agave v2.x
solana-stream-sdk = "1.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
dotenvy = "0.15"

# Solana SDK - Agave v2.x compatible
solana-entry = "2.1.4"
solana-sdk = "2.1.4"
solana-transaction-status = "2.1.4"
solana-client = "2.1.4"

# Serialization
bincode = "1.3.3"
borsh = "1.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jsonc = "1"
bs58 = "0.5.1"
base64 = "0.22"
hex = "0.4.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Performance
rayon = "1.10.0"
crossbeam-channel = "0.5.13"
dashmap = "6.0"
lazy_static = "1.5"

# Utils
sha2 = "0.10.8"
anyhow = "1.0"
backoff = { version = "0.4.0", features = ["tokio"] }
tonic = { version = "0.12.3", features = ["tls"] }
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
# TCP tuning for gRPC
socket2 = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
